[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vanta-hedge"
version = "0.1.0"
description = "Protective-put hedge analyzer for a manually entered equity position."
requires-python = ">=3.12"
dependencies = ["streamlit>=1.38"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vanta_hedge*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
